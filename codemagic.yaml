workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Archive
        working_directory: ios/App
        script: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Package IPA (ditto)
        script: |
          APP_PATH="$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app"
          echo "=== App contents ==="
          ls -la "$APP_PATH"
          echo ""
          echo "=== Packaging with ditto ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload jiachangcai.ipa
          echo "=== Result ==="
          ls -lh jiachangcai.ipa
          file jiachangcai.ipa

    artifacts:
      - jiachangcai.ipa
