workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Build app (unsigned)
        working_directory: ios/App
        script: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Clean & package IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "App.app" -type d -not -path "*/Previews/*" | head -1)
          echo "=== Before cleanup ==="
          ls -la "$APP_PATH"

          # 删除 debug 动态库，这些会导致 Sideloadly 报错
          rm -f "$APP_PATH/__preview.dylib" 2>/dev/null
          rm -f "$APP_PATH/App.debug.dylib" 2>/dev/null
          # 删除 SwiftUI preview 相关
          rm -rf "$APP_PATH/Contents" 2>/dev/null

          echo "=== After cleanup ==="
          ls -la "$APP_PATH"
          echo ""
          echo "=== Packaging ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "jiachangcai.ipa" Payload
          ls -lh jiachangcai.ipa

    artifacts:
      - jiachangcai.ipa
