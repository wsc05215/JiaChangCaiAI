workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Build app (Release unsigned)
        working_directory: ios/App
        script: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_OPTIMIZATION_LEVEL="-Onone"

      - name: Strip & package IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "App.app" -type d -not -path "*/Previews/*" -not -path "*iphonesimulator*" | head -1)
          echo "=== Found: $APP_PATH ==="
          ls -la "$APP_PATH"
          echo ""

          # Strip debug symbols from binary
          BIN="$APP_PATH/App"
          if [ -f "$BIN" ]; then
            echo "=== Stripping debug symbols ==="
            strip -Sx "$BIN" 2>&1 || true
            file "$BIN"
          fi

          echo ""
          echo "=== Packaging IPA ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "jiachangcai.ipa" Payload
          ls -lh jiachangcai.ipa
          echo ""

          # Verify IPA structure
          echo "=== IPA contents ==="
          unzip -l jiachangcai.ipa | head -20

    artifacts:
      - jiachangcai.ipa
