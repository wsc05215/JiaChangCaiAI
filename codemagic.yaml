workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Build app (unsigned)
        working_directory: ios/App
        script: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Verify .app exists
        script: |
          echo "=== Looking for .app ==="
          find "$CM_BUILD_DIR/DerivedData" -name "*.app" -type d
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "*.app" -type d | head -1)
          echo "=== App contents ==="
          ls -la "$APP_PATH" 2>/dev/null || echo "No .app found"
          echo "=== Info.plist ==="
          cat "$APP_PATH/Info.plist" 2>/dev/null || echo "No Info.plist"

      - name: Package IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "*.app" -type d | head -1)
          echo "App path: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r "jiachangcai.ipa" Payload
          echo "IPA size:"
          ls -lh jiachangcai.ipa

    artifacts:
      - jiachangcai.ipa
