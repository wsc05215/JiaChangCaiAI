workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Archive (unsigned)
        working_directory: ios/App
        script: |
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Debug \
            -archivePath "$CM_BUILD_DIR/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        script: |
          mkdir -p Payload
          cp -R "$CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app" Payload/
          zip -r "佳尝菜.ipa" Payload
          rm -rf Payload

    artifacts:
      - 佳尝菜.ipa
