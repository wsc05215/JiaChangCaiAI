workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: latest
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Build app
        working_directory: ios/App
        script: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            ONLY_ACTIVE_ARCH=NO

      - name: Ad-hoc sign & package IPA
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "App.app" -type d -not -path "*/Previews/*" | head -1)
          echo "=== App: $APP_PATH ==="
          echo ""
          echo "=== Ad-hoc signing ==="
          codesign --force --sign - --timestamp=none "$APP_PATH" 2>&1
          echo ""
          echo "=== Verify signature ==="
          codesign -dvvv "$APP_PATH" 2>&1 || true
          echo ""
          echo "=== Package IPA ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "jiachangcai.ipa" Payload
          ls -lh jiachangcai.ipa

    artifacts:
      - jiachangcai.ipa
