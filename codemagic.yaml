workflows:
  ios-build:
    name: iOS Build (佳尝菜)
    max_build_duration: 30
    environment:
      xcode: 16.4
      cocoapods: default
      node: 20
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
    scripts:
      - name: Install dependencies
        script: npm install

      - name: Install frontend dependencies
        working_directory: frontend
        script: npm install

      - name: Build web app
        working_directory: frontend
        script: npm run build:app

      - name: Sync Capacitor to iOS
        script: npx cap sync ios

      - name: Install CocoaPods dependencies
        working_directory: ios/App
        script: pod install

      - name: Build app (Release unsigned)
        working_directory: ios/App
        script: |
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      - name: Diagnostic & package
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/DerivedData" -name "App.app" -type d -not -path "*/Previews/*" -not -path "*iphonesimulator*" | head -1)
          echo "=== 1. App location ==="
          echo "$APP_PATH"
          echo ""

          echo "=== 2. Binary info ==="
          BIN="$APP_PATH/App"
          file "$BIN"
          lipo -info "$BIN" 2>/dev/null || true
          otool -l "$BIN" 2>/dev/null | grep -E "cmd |LC_|minos|sdk" | head -10 || true
          echo ""

          echo "=== 3. Frameworks ==="
          ls -la "$APP_PATH/Frameworks/" 2>/dev/null || echo "No Frameworks dir"
          echo ""

          echo "=== 4. All files ==="
          find "$APP_PATH" -type f | sort
          echo ""

          echo "=== 5. Info.plist (readable) ==="
          plutil -p "$APP_PATH/Info.plist" 2>/dev/null || plistutil -i "$APP_PATH/Info.plist" 2>/dev/null || echo "Cannot parse plist"
          echo ""

          echo "=== 6. Package ==="
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -rq "jiachangcai.ipa" Payload
          ls -lh jiachangcai.ipa
          echo "MD5: $(md5 -q jiachangcai.ipa)"

    artifacts:
      - jiachangcai.ipa
